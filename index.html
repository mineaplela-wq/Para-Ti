<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PARA TI 🤍</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7198c;color:white;font-family:Georgia,serif;overflow:hidden}
header{text-align:center;padding:14px;font:bold 17px Arial;letter-spacing:2px}
#universe{display:block;width:94%;height:68vh;margin:auto;background:radial-gradient(ellipse,#282039,#080711 65%,#020208);border:2px solid #ffb5e8;border-radius:28px;box-shadow:0 0 30px #ff8bd8}
.controls{text-align:center;padding:12px}
button{background:#570b40;color:white;border:1px solid #ffc9ed;border-radius:25px;padding:11px;margin:4px}
p{text-align:center;font-size:13px;padding:0 10px}
</style>
</head>
<body>
<header>PARA TI 🤍</header>
<canvas id="universe"></canvas>
<p>Arraste as frases e o coração com o dedo ✨</p>
<div class="controls">
<button onclick="addText()">Adicionar frase ✨</button>
<button onclick="changeHeart()">Mudar coração 🤍</button>
<button onclick="document.getElementById('photos').click()">Adicionar fotos 📸</button>
<input id="photos" type="file" accept="image/*" multiple hidden>
</div>
<script>
const c=document.getElementById('universe');
const x=c.getContext('2d');
let W,H,stars=[],items=[],drag=null;
let heart='♡';
function resize(){
 W=c.width=c.clientWidth;
 H=c.height=c.clientHeight;
 stars=Array.from({length:250},()=>({
 x:Math.random()*W,y:Math.random()*H,
 r:Math.random()*1.5+.3,a:Math.random()
 }));
 if(!items.length){
 items=[
 {type:'text',text:'Te amo 🤍',x:W/2,y:H*.28,size:25},
 {type:'text',text:'Minha paz ✨',x:W*.23,y:H*.56,size:13},
 {type:'text',text:'Meu universo',x:W*.76,y:H*.57,size:13},
 {type:'text',text:'Tu és especial ♡',x:W/2,y:H*.82,size:15},
 {type:'heart',x:W/2,y:H*.49,size:55}
 ];
 }
}
function draw(){
 x.clearRect(0,0,W,H);
 let g=x.createRadialGradient(W/2,H/2,1,W/2,H/2,W*.8);
 g.addColorStop(0,'#32214c');g.addColorStop(1,'#020208');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 stars.forEach(s=>{
 s.a+=(Math.random()-.5)*.08;
 s.a=Math.max(.15,Math.min(1,s.a));
 x.fillStyle=`rgba(255,255,255,${s.a})`;
 x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();
 });
 // Galáxia espiral
 x.save();x.translate(W/2,H*.55);
 for(let i=0;i<1000;i++){
 let a=i*.13+Date.now()*.00015;
 let r=i/1000*Math.min(W,H)*.48;
 let px=Math.cos(a)*r,py=Math.sin(a)*r*.48;
 x.fillStyle=`rgba(210,185,255,${1-i/1200})`;
 x.beginPath();x.arc(px,py,Math.random()*1.2+.3,0,7);x.fill();
 }
 x.restore();
 // Elementos arrastáveis
 items.forEach(o=>{
 x.save();x.textAlign='center';x.textBaseline='middle';
 x.shadowBlur=15;x.shadowColor='#ff8be8';
 if(o.type==='heart'){
 x.font=`${o.size}px Arial`;x.fillStyle='#ffb8ed';
 x.fillText(heart,o.x,o.y);
 }else if(o.type==='text'){
 x.font=`${o.size}px Georgia`;x.fillStyle='white';
 x.fillText(o.text,o.x,o.y);
 }else if(o.type==='image'){
 x.drawImage(o.img,o.x-25,o.y-32,50,64);
 }
 x.restore();
 });
 requestAnimationFrame(draw);
}
function addText(){
 let t=prompt('Escreva uma frase:');
 if(t)items.push({type:'text',text:t,x:W/2,y:H/2,size:16});
}
function changeHeart(){
 heart=heart==='♡'?'♥':heart==='♥'?'🤍':'♡';
}
c.addEventListener('pointerdown',e=>{
 let r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
 drag=[...items].reverse().find(o=>Math.hypot(o.x-px,o.y-py)<65);
 if(drag){c.setPointerCapture(e.pointerId)}
});
c.addEventListener('pointermove',e=>{
 if(!drag)return;
 let r=c.getBoundingClientRect();
 drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;
});
c.addEventListener('pointerup',()=>drag=null);
c.addEventListener('pointercancel',()=>drag=null);
document.getElementById('photos').addEventListener('change',e=>{
 [...e.target.files].slice(0,8).forEach(f=>{
 let im=new Image();
 im.onload=()=>items.push({
 type:'image',img:im,
 x:Math.random()*W*.7+W*.15,
 y:Math.random()*H*.6+H*.2
 });
 im.src=URL.createObjectURL(f);
 });
});
addEventListener('resize',resize);
resize();draw();
</script>
</body>
</html>
